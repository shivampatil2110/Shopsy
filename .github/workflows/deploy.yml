name: Deploy to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.check-backend.outputs.changed }}
      frontend-changed: ${{ steps.check-frontend.outputs.changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Check Backend Changes
        id: check-backend
        run: |
          if git diff --name-only HEAD~1 HEAD | grep '^backend/'; then
            echo "changed=true" >> $GITHUB_ENV
          else
            echo "changed=false" >> $GITHUB_ENV
          fi
        outputs:
          changed: ${{ env.changed }}

      - name: Check Frontend Changes
        id: check-frontend
        run: |
          if git diff --name-only HEAD~1 HEAD | grep '^frontend/'; then
            echo "changed=true" >> $GITHUB_ENV
          else
            echo "changed=false" >> $GITHUB_ENV
          fi
        outputs:
          changed: ${{ env.changed }}

  deploy-backend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH Connection
        run: |
          sudo touch ~/server-login.pem
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/server-login.pem
          chmod 600 /tmp/server-login.pem
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "Host ec2-15-206-189-217.ap-south-1.compute.amazonaws.com
                StrictHostKeyChecking no" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy Backend
        run: |
          ssh -tt -i "/tmp/server-login.pem" ubuntu@ec2-15-206-189-217.ap-south-1.compute.amazonaws.com << 'EOF'
          cd /home/ubuntu/backend
          git reset --hard origin/master
          npm install
          pm2 restart backend-service
          EOF

  deploy-frontend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH Connection
        run: |
          sudo touch ~/server-login.pem
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/server-login.pem
          chmod 600 /tmp/server-login.pem
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "Host ec2-15-206-189-217.ap-south-1.compute.amazonaws.com
                StrictHostKeyChecking no" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy Frontend
        run: |
          ssh -tt -i "/tmp/server-login.pem" ubuntu@ec2-15-206-189-217.ap-south-1.compute.amazonaws.com << 'EOF'
          cd /home/ubuntu/frontend
          git reset --hard origin/master
          npm install
          npm run build
          serve -s build
          EOF

  disconnect-ec2:
    needs: [deploy-backend, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Disconnect from EC2 Instance
        run: |
          echo "Disconnecting from EC2 instance..."
          ssh -O exit -i "/tmp/server-login.pem" ubuntu@ec2-15-206-189-217.ap-south-1.compute.amazonaws.com
